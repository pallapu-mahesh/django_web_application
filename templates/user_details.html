{% load static %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background-image: url("{% static 'images/image01.png' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: Arial, sans-serif;
    }

    .navbar {
        height: 75px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 60px;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
    }

    .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
        text-decoration: none;
    }

    .logo span {
        color: #3b82f6;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 35px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        transition: 0.3s;
    }

    .nav-links a:hover {
        color: #60a5fa;
    }

    .nav-btn {
        padding: 10px 18px;
        border-radius: 8px;
        background: #2563eb;
    }

    .nav-btn:hover {
        color: white !important;
        background: #1d4ed8;
    }

    .login-wrapper {
        min-height: calc(100vh - 75px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card {
        width: 800px;
        padding: 35px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        color: white;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .login-card h1 {
        text-align: center;
        margin-bottom: 25px;
        color: rgb(234, 234, 242);
        font-size: 40px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border: 1px solid #e9e4e4d6;
        color: #000;
    }

    th {
        background: rgba(37, 99, 235, 0.85);
        color: white;
    }

    td {
        background: rgba(219, 215, 215, 0.85);
    }
</style>

<nav class="navbar">
    <a href="{% url 'home' %}" class="logo">
        UPI FRAUD <span>DETECTION</span>
    </a>
    <div class="nav-links">
        <a href="{% url 'logout' %}" class="nav-btn">Logout</a>
    </div>
</nav>

<div class="login-wrapper">
    <div class="login-card">
        <h1>Users Details</h1>
        <table>
            <tr>
                <th>Username</th>
                <th>Password</th>
                <th>Email</th>
                <th>Address</th>
            </tr>
            {% for user in users %}
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.password }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.address }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
