{% extends "home.html" %}

{% block content %}

<style>
    .login-container {
        min-height: calc(100vh - 75px);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        width: 380px;
        padding: 35px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        color: white;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .login-card h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        outline: none;
    }

    .form-group input:focus {
        border-color: #3b82f6;
    }

    .login-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .login-button:hover {
        background: #1d4ed8;
    }

    .message {
        text-align: center;
        margin-top: 15px;
        color: #fca5a5;
    }
</style>

<div class="login-container">

    <div class="login-card">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

            {% if msg %}
                <p class="message">{{ msg }}</p>
            {% endif %}

        </form>

    </div>

</div>

{% endblock %}
