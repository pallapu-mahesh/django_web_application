{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEBSITE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url("{% static 'images/image01.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 75px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 60px;

            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .nav-btn {
            padding: 10px 18px;
            border-radius: 8px;
            background: #2563eb;
        }

        .nav-btn:hover {
            color: white !important;
            background: #1d4ed8;
        }
        h1{

            color:rgb(234, 234, 242);
            font-size: 50px;



        }
    </style>
</head>

<body>

    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            UPI FRAUD <span>DETECTION</span>
        </a>
        <div class="nav-links">



            <button><a href="{% url 'logout' %}" class="nav-btn">Logout</a></button>
        </div>

    </nav>

    <center>
        <h1>
            welcome to user dashboard Page
        </h1>
    </center>

</body>
</html>
